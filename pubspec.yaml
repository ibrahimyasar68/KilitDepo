name: kilitdepo
description: "KilitDepo — çevrimdışı kişisel şifre yöneticisi. İY Labs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Paket sürümleri bilinçli olarak sabitlenmiştir (caret yok).
# Güncelleme yapmadan önce değişiklik notları ve güvenlik etkisi incelenmelidir.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Sürümü flutter_localizations tarafından belirlenir.

  flutter_riverpod: 3.5.0
  go_router: 18.1.3
  drift: 2.35.4
  sqlite3: 3.9.1 # SQLCipher derlemesi aşağıdaki hooks ayarıyla seçilir.
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  cryptography: 2.9.0
  local_auth: 3.0.2
  screen_protector: 1.5.3
  package_info_plus: 10.2.2
  file_picker: 13.3.2 # Yedek dosyasını kaydetme/seçme (sistem penceresi, izin gerektirmez)
  # 1.9.0: Flutter'ın kendi Material kütüphanesini kullanan son sürüm (2.x ayrı
  # material_ui paketine geçti ve Flutter 3.47 ile tür uyuşmazlığı veriyor).
  dynamic_color: 1.9.0 # İsteğe bağlı Material You (Android 12+)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.17.1
  drift_dev: 2.35.3
  mocktail: 1.0.5
  flutter_native_splash: 2.4.8

# package:sqlite3 3.x, SQLite'ı "hooks" ile uygulamaya gömer.
# "sqlcipher" seçimi SQLCipher community edition derlemesini kullanır
# (eski sqlcipher_flutter_libs paketinin yerini alır).
# İkili dosyalar DERLEME sırasında indirilir ve sha256 ile doğrulanır;
# uygulama çalışırken hiçbir ağ erişimi yoktur.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Uygulamaya gömülü native kütüphanelerin lisans metinleri
    # (Dart paketlerinin lisansları Flutter tarafından otomatik eklenir).
    - assets/licenses/

  # Yazı tipleri uygulamaya gömülüdür; internetten indirilmez (çevrimdışı).
  # Lisans: SIL Open Font License 1.1 (assets/licenses/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# Açılış ekranı görselleri tool/generate_brand_assets.py ile üretilir.
flutter_native_splash:
  color: "#F4F7FB"
  color_dark: "#0F1419"
  image: assets/brand/splash_logo.png
  android_12:
    # Android 12+: sistem görseli daire içinde gösterir; zemin petrol yeşili.
    color: "#F4F7FB"
    color_dark: "#0F1419"
    image: assets/brand/splash_android12.png
    icon_background_color: "#0F6E56"
    icon_background_color_dark: "#0F6E56"
